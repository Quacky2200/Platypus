[package]
name = "platypus_render_cpu"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
autotests = false

[dependencies]
bytemuck = "1.25.2"
web_ui_core = { version = "0.1.0", path = "../web_ui_core" }
# The frame plan, the glyph and image caches the plan executor shares with the GPU executors.
web_ui_render = { version = "0.1.0", path = "../web_ui_render" }
platypus_ui = { version = "0.1.0", path = "../platypus_ui" }
tracing = "0.1.44"
# The vello renderer's own.
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"], optional = true }
raw-window-handle = { version = "0.6", optional = true }
resvg = { version = "0.48.1", default-features = false, features = ["text"], optional = true }
softbuffer = { version = "0.4.8", optional = true }
# Multithreaded rasterisation (a frame with layer filters uses one thread: vello_cpu's filters
# need it).
vello_common = { version = "0.3.0", optional = true }
vello_cpu = { version = "0.3.0", features = ["multithreading"], optional = true }

[features]
# The vello renderer (`platypus-app`'s `renderer: "cpu"`). A host that only runs the frame plan
# (`plan::PlanRenderer`) turns it off and links none of it.
default = ["vello"]
vello = ["dep:image", "dep:raw-window-handle", "dep:resvg", "dep:softbuffer", "dep:vello_common", "dep:vello_cpu"]

[dev-dependencies]
image = { version = "0.25.10", default-features = false, features = ["png"] }
web_ui_core = { path = "../web_ui_core" }
# The plan executor is tested against the GLES one (`tests/vs_gles.rs`), skipped without EGL.
glow = "0.16"
platypus_render_gles = { path = "../platypus_render_gles", default-features = false }

# Every integration test in one executable; the vello renderer's own modules (`blending`,
# `gradients`) need the `vello` feature (`tests/main.rs`).
[[test]]
name = "integration"
path = "tests/main.rs"
