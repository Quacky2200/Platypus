[package]
name = "platypus_render"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
autotests = false

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
platypus_core = { version = "0.1.0", path = "../platypus_core" }
# The UI renderer, GPU and surfaces; re-exported whole.
web_ui_render = { workspace = true }
pollster = "1.0.1"
tracing = "0.1.44"
wgpu = "30.0.1"
lyon_tessellation = "1.0.22"

[dev-dependencies]
platypus_core = { path = "../platypus_core" }
web_ui_dom = { workspace = true }
# The built-in post-process effects (their WGSL and parameters) live there.
platypus_render_api = { path = "../platypus_render_api" }

[[test]]
name = "integration"
path = "tests/main.rs"
