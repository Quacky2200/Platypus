[package]
name = "platypus_app"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
# `platypus-app`, the host of every game, picks its renderer per game (`host.rs`).
default-run = "platypus-app"
autobins = false
autotests = false

[dependencies]
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
platypus_audio = { path = "../platypus_audio" }
platypus_core = { path = "../platypus_core" }
platypus_physics = { path = "../platypus_physics" }
platypus_scene = { path = "../platypus_scene" }
platypus_platform = { path = "../platypus_platform" }
platypus_render = { path = "../platypus_render" }
web_ui_render_gles = { workspace = true }
web_ui_render_cpu = { workspace = true }
web_ui_dom = { workspace = true }
web_ui_react = { workspace = true }
platypus_engine_api = { path = "../platypus_engine_api", default-features = false }
platypus_animation = { path = "../platypus_animation" }
platypus_scenes = { path = "../platypus_scenes" }
platypus_physics_api = { path = "../platypus_physics_api" }
platypus_acoustics = { path = "../platypus_acoustics" }
platypus_render_api = { path = "../platypus_render_api" }
platypus_components = { path = "../platypus_components" }
ts_api = { workspace = true }
platypus_kinds = { path = "../platypus_kinds" }
# The AOT compiler used as a JIT (its own workspace under tools/).
web_ui_ts = { workspace = true }
web_ui_rt = { workspace = true }
web_ui_bridge = { workspace = true }
# The game's Windows app id, registration and Start-menu shortcut (`identity.rs`).
desktop_window = { workspace = true }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "ico"] }
notify = "8.2.0"
arboard = { version = "3.7.0", default-features = false }
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
sys-locale = "0.3.2"
serde_json = "1.0.154"
platypus_pack = { path = "../platypus_pack" }
platypus_net = { path = "../platypus_net", default-features = false }
platypus_net_quic = { path = "../platypus_net_quic" }
gltf = { version = "1.4.1", default-features = false, features = ["utils", "names", "KHR_materials_unlit", "KHR_materials_emissive_strength"] }
# FBX models (`models_fbx.rs`): bindings to the ufbx C loader (MIT OR Unlicense), built with `cc`.
ufbx = "0.11"

[features]
# ANGLE linked into the program (Windows), not loaded from libEGL.dll: see web_ui_render_gles.
# On by default (it needs libclang to build: `LIBCLANG_PATH`); `--no-default-features` leaves it
# out. Off Windows it does nothing.
default = ["static-angle", "net-debug"]
# Network fault injection for `Network.debugConditions` (debug and tests; see platypus_net).
net-debug = ["platypus_net/net-debug", "platypus_engine_api/net-debug"]
static-angle = ["web_ui_render_gles/static-angle"]

# The build script turns resources/icon/icon.png into the window icon and the exe's icon.
[build-dependencies]
platypus_core = { path = "../platypus_core" }
image = { version = "0.25.10", default-features = false, features = ["png"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Console", "Win32_Foundation", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_System_Diagnostics_Debug", "Win32_System_Kernel", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_UI_WindowsAndMessaging"] }


# The engine host: wgpu with the 3D world (Vulkan / DX12 / Metal), or for a game that is only UI
# the light GLES path (or, opted into, the CPU renderer); see `host.rs`.
[[bin]]
name = "platypus-app"
path = "src/main.rs"

[[test]]
name = "integration"
path = "tests/main.rs"
