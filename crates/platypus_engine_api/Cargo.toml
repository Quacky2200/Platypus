[package]
name = "platypus_engine_api"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

# Debug-only network fault injection (`Network.debugConditions`); `platypus-build package` never ships it.
[features]
default = ["net-debug"]
net-debug = ["platypus_net/net-debug"]

[dependencies]
glam = "0.34.1"
jiff = "0.2"
serde_json = "1"
ts_api = { workspace = true, features = ["glam"] }
web_api_window = { workspace = true }
platypus_ai = { path = "../platypus_ai" }
platypus_animation = { path = "../platypus_animation" }
platypus_math = { path = "../platypus_math" }
platypus_scene = { path = "../platypus_scene" }
platypus_kinds = { path = "../platypus_kinds" }
platypus_core = { path = "../platypus_core" }
platypus_net = { path = "../platypus_net", default-features = false }
